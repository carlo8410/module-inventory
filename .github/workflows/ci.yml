name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Check Formatting (Prettier)
        run: npx prettier --check "**/*.{ts,js,json,md}"

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test
        continue-on-error: true

      - name: Run Acceptance Tests
        if: always()
        run: npm run test:acceptance
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          npm run posttest
          npm run allure:generate

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      - name: Install esbuild
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: npm --prefix mc-product-registration install --save-dev esbuild

      - name: Bundle with esbuild
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: npm --prefix mc-product-registration run build:lambda

      - name: Package for Lambda (ZIP)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd mc-product-registration
          zip -j ../lambda.zip dist/index.js

      - name: Upload Lambda ZIP Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip

  deploy-canary:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      new_version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Lambda ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Publish New Version
        id: publish
        run: |
          VERSION=$(aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda.zip \
            --publish \
            --query 'Version' --output text)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Update API Gateway OpenAPI Spec
        run: |
          # 1. Get AWS Account ID
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          
          # 2. Construct Lambda Invoke ARN for the 'fixed' alias
          LAMBDA_INVOKE_ARN="arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${{ secrets.LAMBDA_FUNCTION_NAME }}:fixed/invocations"
          
          # 3. Get API Gateway ID dynamically by name
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='mc-inventory-api'].id" --output text)
          
          # 4. Resolve template variables and remove payloadFormatVersion in-place via Node.js
          export LAMBDA_INVOKE_ARN
          node -e "
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('api-doc.json', 'utf8'));
          
          const integration = doc.paths['/register-new-product'].post['x-amazon-apigateway-integration'];
          integration.uri = process.env.LAMBDA_INVOKE_ARN;
          delete integration.payloadFormatVersion;
          
          fs.writeFileSync('api-doc-resolved.json', JSON.stringify(doc, null, 2));
          "
          
          # 5. Import/overwrite the OpenAPI spec into API Gateway
          aws apigateway put-rest-api --rest-api-id $API_ID --mode overwrite --body fileb://api-doc-resolved.json
          
          # 6. Deploy the changes to the Stage 'dev'
          aws apigateway create-deployment --rest-api-id $API_ID --stage-name dev

      - name: Deploy Canary (10%)
        run: |
          NEW_VERSION=${{ steps.publish.outputs.version }}

          # Obtenemos la versión actual del alias fixed
          CURRENT_VERSION=$(aws lambda get-alias \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --name fixed \
            --query 'FunctionVersion' --output text)

          echo "Nueva versión: $NEW_VERSION | Versión Actual: $CURRENT_VERSION"

          # Si la versión actual es igual a la nueva, no aplicamos pesos (ya está promocionada)
          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "La versión actual ya es la versión nueva. Omitiendo routing config."
          else
            # Aplicamos el 10% de peso a la nueva versión
            aws lambda update-alias \
              --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
              --name fixed \
              --routing-config "{\"AdditionalVersionWeights\":{\"$NEW_VERSION\":0.1}}"
          fi

  promote-canary:
    needs: deploy-canary
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Full Traffic Shift (100%)
        run: |
          NEW_VERSION=${{ needs.deploy-canary.outputs.new_version }}

          echo "Promocionando la versión $NEW_VERSION al 100% del tráfico."

          aws lambda update-alias \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --name fixed \
            --function-version "$NEW_VERSION" \
            --routing-config "{\"AdditionalVersionWeights\":{}}"
